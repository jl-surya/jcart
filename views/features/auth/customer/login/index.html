<!DOCTYPE html>
<!-- Customer Login Page - User authentication and login form -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="description" content="Login to your JCart account to access exclusive offers and manage your orders">
    <meta name="keywords" content="login, sign in, JCart, ecommerce">
    <title>Login - JCart</title>
    <link rel="icon" type="image/svg+xml" href="/JCart/views/assets/favicon.svg">
    <link rel="stylesheet" href="/JCart/views/shared/navbar/navbar.css">
    <link rel="stylesheet" href="styles.css">
    <script src="/JCart/views/utils/toast.js" defer></script>
    <script src="/JCart/views/shared/navbar/navbar.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header id="navbar"></header>

    <div class="auth-container">
        <div class="form-wrapper">
            <div class="form-header">
                <div class="header-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </div>
                <h2>Welcome Back</h2>
                <p>Log in to access your account and start shopping.</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="usernameOrEmail">
                        Username or Email <span class="required">*</span>
                    </label>
                    <input type="text"
                           id="usernameOrEmail"
                           name="usernameOrEmail"
                           placeholder="Enter your username or email"
                           autocomplete="username"
                           required>
                    <div class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="password">
                        Password <span class="required">*</span>
                    </label>
                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="Enter your password"
                           autocomplete="current-password"
                           required>
                    <div class="error-message"></div>
                </div>

                <button type="submit" class="btn-submit">
                    <span>Log In</span>
                </button>

                <div class="signup-link">
                    <p>Don't have an account? <a href="/JCart/views/features/auth/customer/register/">Create an account</a></p>
                </div>
            </form>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            // Load navbar
            fetch('/JCart/views/shared/navbar/navbar.html')
                .then(function (r) {
                    if (!r.ok) throw new Error('Failed to load navbar');
                    return r.text();
                })
                .then(function (html) {
                    document.getElementById('navbar').innerHTML = html;
                    if (window.initializeNavbar) window.initializeNavbar();
                })
                .catch(function (err) { console.error('Error loading navbar:', err);  });

            if (localStorage.getItem('isLoggedIn') === 'true') {
                window.location.replace('/JCart/views/index.html');
            }
        })();
    </script>
</body>
</html>
