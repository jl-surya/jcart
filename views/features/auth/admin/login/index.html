<!DOCTYPE html>
<!-- Admin Login Page - Administrator authentication and login form -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="description" content="JCart Admin Portal - Secure login for administrators">
    <meta name="keywords" content="admin, login, JCart, management">
    <title>Admin Login - JCart</title>
    <link rel="icon" type="image/svg+xml" href="/JCart/views/assets/favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <script src="/JCart/views/utils/toast.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="auth-container">
        <div class="form-wrapper">
            <div class="form-header">
                <div class="header-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
                </div>
                <h2>Admin Portal</h2>
                <p>Sign in to access the administration dashboard.</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="usernameOrEmail">
                        Username or Email <span class="required">*</span>
                    </label>
                    <input type="text"
                           id="usernameOrEmail"
                           name="usernameOrEmail"
                           placeholder="Enter your username or email"
                           autocomplete="username"
                           required>
                    <div class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="password">
                        Password <span class="required">*</span>
                    </label>
                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="Enter your password"
                           autocomplete="current-password"
                           required>
                    <div class="error-message"></div>
                </div>

                <button type="submit" class="btn-submit">
                    <span>Sign In</span>
                </button>
            </form>

            <div class="back-link">
                <a href="/JCart/views/index.html">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                    Back to Store
                </a>
            </div>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            if (localStorage.getItem('adminLoggedIn') === 'true') {
                window.location.replace('/JCart/views/features/admin/dashboard/');
            }
        })();
    </script>
</body>
</html>
