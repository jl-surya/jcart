<!-- Shared Pagination Component - Reusable pagination controls for product listings -->
<div class="pagination-wrapper" id="paginationWrapper">
    <div class="pagination-container" id="paginationContainer">
        <button type="button" class="pagination-btn" id="paginationPrev" aria-label="Previous page">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="pagination-pages" id="paginationPages"></div>
        <button type="button" class="pagination-btn" id="paginationNext" aria-label="Next page">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <div class="pagination-info">
            <span id="paginationSummary">Showing 0 of 0</span>
            <select id="paginationSize" aria-label="Items per page">
                <option value="15">15 per page</option>
                <option value="30">30 per page</option>
                <option value="45">45 per page</option>
            </select>
        </div>
    </div>
</div>
